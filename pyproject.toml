[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cavda"
version = "0.1.0"
description = "CLI AI Video Downloader App — allow-list-only, stateless, no DRM/paywall bypass."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["cli", "yt-dlp", "claude", "allowlist"]
classifiers = [
    "Environment :: Console",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Topic :: Multimedia :: Video",
]

dependencies = [
    "anthropic>=0.75",
    "pyyaml>=6.0",
    "yt-dlp>=2024.1.1",
]

[project.scripts]
cavda = "cavda.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
